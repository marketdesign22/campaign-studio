<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ロサンゼルス留学・大学進学 ｜ HEI（語学学校）× SCSU（大学）日本人向け</title>
  <meta name="description" content="ロサンゼルスの語学学校HEIと認定大学SCSU。上部のボタンで切り替え。語学留学から学位取得・OPT就労まで、日本人スタッフがサポート。" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#fff;overflow:hidden}

    /* ===== TOP SWITCH BAR ===== */
    .switch-hint{
      position:fixed;top:0;left:0;right:0;z-index:1001;height:24px;
      display:flex;align-items:center;justify-content:center;gap:6px;
      background:linear-gradient(90deg,#F99521,#2d6a9f);color:#fff;
      font-size:12px;font-weight:800;letter-spacing:.02em;
    }
    .switch-hint .ar{font-size:14px;animation:hintwig 1.1s ease-in-out infinite}
    @keyframes hintwig{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
    .switch-bar{
      position:fixed;top:24px;left:0;right:0;z-index:1000;height:74px;
      display:flex;background:#fff;border-bottom:1px solid #e4e4e4;
      box-shadow:0 2px 10px rgba(0,0,0,.10);
    }
    .switch-btn{
      flex:1;border:none;background:#f2f2f2;cursor:pointer;position:relative;
      display:flex;align-items:center;justify-content:center;gap:11px;
      font-family:inherit;color:#9a9a9a;font-weight:700;
      border-bottom:5px solid transparent;transition:all .18s ease;padding:0 14px;
    }
    .switch-btn:hover:not(.active){background:#e9e9e9;color:#666}
    /* small "tap to switch" tag on the inactive tab */
    .switch-btn .tag{
      position:absolute;top:7px;right:10px;font-size:10px;font-weight:800;
      padding:2px 8px;border-radius:999px;line-height:1;white-space:nowrap;
      opacity:0;transition:opacity .18s ease;
    }
    .switch-btn:not(.active) .tag{opacity:1;animation:tagpulse 1.6s ease-in-out infinite}
    @keyframes tagpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    .switch-btn .logo{height:42px;width:auto;max-width:150px;object-fit:contain;flex-shrink:0}
    .switch-btn .tx{display:flex;flex-direction:column;text-align:left;line-height:1.2}
    .switch-btn .nm{font-size:17px;font-weight:800}
    .switch-btn .sb{font-size:10.5px;font-weight:500;color:#b3b3b3}
    /* HEI */
    .switch-btn.hei.active{background:#fff;color:#EC6A0E;border-bottom-color:#F99521}
    .switch-btn.hei.active .sb{color:#c98a52}
    .switch-btn.hei .tag{background:#fdecd8;color:#EC6A0E}
    /* SCSU */
    .switch-btn.scsu.active{background:#fff;color:#1a3a5c;border-bottom-color:#2d6a9f}
    .switch-btn.scsu.active .sb{color:#6f93b3}
    .switch-btn.scsu .tag{background:#e2edf7;color:#1a3a5c}

    /* ===== FRAMES ===== */
    .frame-wrap{position:fixed;top:98px;left:0;right:0;bottom:0}
    .frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}
    .frame-wrap iframe.active{display:block}

    @media (max-width:520px){
      .switch-bar{height:64px}
      .frame-wrap{top:88px}
      .switch-btn .logo{height:34px}
      .switch-btn .sb{display:none}
      .switch-btn .nm{font-size:14px}
      .switch-btn .tag{top:5px;right:6px;font-size:9px;padding:2px 6px}
    }
  </style>
</head>
<body>

  <div class="switch-hint" aria-hidden="true">
    <span class="ar">←</span><span>タップで学校を切り替え / TAP TO SWITCH SCHOOL</span><span class="ar">→</span>
  </div>

  <nav class="switch-bar" role="tablist" aria-label="学校切り替え">
    <button class="switch-btn hei active" id="btnHei" role="tab" aria-selected="true" onclick="showTab('hei')">
      <img class="logo" src="images/logo-orange.png" alt="" aria-hidden="true">
      <span class="tx"><span class="nm">語学学校 HEI</span><span class="sb">Hollywood Education Institute</span></span>
      <span class="tag">切替 ▸</span>
    </button>
    <button class="switch-btn scsu" id="btnScsu" role="tab" aria-selected="false" onclick="showTab('scsu')">
      <img class="logo" src="images/scsu-seal.svg" alt="" aria-hidden="true">
      <span class="tx"><span class="nm">大学・大学院 SCSU</span><span class="sb">Southern California State University</span></span>
      <span class="tag">◂ 切替</span>
    </button>
  </nav>

  <div class="frame-wrap">
    <iframe id="frameHei"  class="active" src="hei.html" title="HEI 語学学校" loading="eager"></iframe>
    <iframe id="frameScsu" data-src="scsu.html" title="SCSU 大学・大学院" loading="lazy"></iframe>
  </div>

  <script>
    function showTab(tab){
      var isHei = tab === 'hei';
      var fScsu = document.getElementById('frameScsu');
      // lazy-load SCSU on first open
      if(!isHei && !fScsu.src){ fScsu.src = fScsu.getAttribute('data-src'); }

      document.getElementById('btnHei').classList.toggle('active', isHei);
      document.getElementById('btnScsu').classList.toggle('active', !isHei);
      document.getElementById('btnHei').setAttribute('aria-selected', isHei);
      document.getElementById('btnScsu').setAttribute('aria-selected', !isHei);
      document.getElementById('frameHei').classList.toggle('active', isHei);
      fScsu.classList.toggle('active', !isHei);
      document.title = isHei
        ? 'ロサンゼルス語学留学 ｜ HEI 語学学校（日本人向け）'
        : 'ロサンゼルス大学進学・学位取得 ｜ SCSU 認定大学（日本人向け）';
      // reflect selection in the URL hash (shareable deep-link)
      if(history.replaceState) history.replaceState(null, '', isHei ? '#hei' : '#scsu');
    }
    // open SCSU directly via #scsu (e.g. from an ad link)
    if(location.hash === '#scsu'){ showTab('scsu'); }
  </script>

</body>
</html>
