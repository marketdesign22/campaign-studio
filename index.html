<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ロサンゼルス留学・大学進学 ｜ HEI（語学学校）× SCSU（大学）日本人向け</title>
  <meta name="description" content="ロサンゼルスの語学学校HEIと認定大学SCSU。上部のボタンで切り替え。語学留学から学位取得・OPT就労まで、日本人スタッフがサポート。" />

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GS4B9BMVTK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-GS4B9BMVTK');
</script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#fff;overflow:hidden}

    /* ===== TOP CHROME (fixed) ===== */
    #topchrome{position:fixed;top:0;left:0;right:0;z-index:1000}

    /* --- visa alert --- */
    .visa-alert{
      display:flex;align-items:center;justify-content:center;gap:9px;
      background:#fff;color:#1c2b3a;
      padding:10px 16px;text-align:center;line-height:1.5;
      font-weight:700;font-size:clamp(13.5px,3.5vw,18px);letter-spacing:.01em;
      border-top:4px solid #d92638;border-bottom:1px solid #eadfe1;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }
    .visa-alert b{color:#d92638;white-space:nowrap;font-weight:900}
    .visa-alert .va-ic{font-size:1.35em;flex:none;line-height:1;animation:vapulse 1.05s ease-in-out infinite}
    @keyframes vapulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

    /* --- switch tabs --- */
    .switch-bar{
      display:flex;background:#fff;border-bottom:1px solid #d6d6d6;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }
    .switch-btn{
      flex:1;border:none;cursor:pointer;position:relative;
      display:flex;align-items:center;justify-content:center;gap:11px;
      font-family:inherit;font-weight:700;padding:11px 14px;
      border-bottom:5px solid transparent;transition:background .16s ease,opacity .16s ease;
    }
    /* light school-color fills + a clear divider between the two */
    .switch-btn.hei{background:#fdeede;color:#b56a1e;border-right:2px solid #d6d6d6}
    .switch-btn.scsu{background:#e6f0fa;color:#3a5f83}
    .switch-btn:not(.active){opacity:.7}
    .switch-btn:hover:not(.active){opacity:.9}
    .switch-btn.hei.active{background:#fff6ec;color:#EC6A0E;border-bottom-color:#F99521;opacity:1}
    .switch-btn.hei.active .sb{color:#c98a52}
    .switch-btn.scsu.active{background:#f1f7fe;color:#1a3a5c;border-bottom-color:#2d6a9f;opacity:1}
    .switch-btn.scsu.active .sb{color:#6f93b3}
    .switch-btn .logo{height:40px;width:auto;max-width:150px;object-fit:contain;flex-shrink:0}
    .switch-btn .tx{display:flex;flex-direction:column;text-align:left;line-height:1.2}
    .switch-btn .nm{font-size:16px;font-weight:800}
    .switch-btn .sb{font-size:10.5px;font-weight:500;color:#b3b3b3}

    /* ===== FRAMES ===== */
    .frame-wrap{position:fixed;top:120px;left:0;right:0;bottom:0}
    .frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}
    .frame-wrap iframe.active{display:block}

    @media (max-width:520px){
      .switch-btn{padding:9px 10px;gap:8px}
      .switch-btn .logo{height:32px}
      .switch-btn .sb{display:none}
      .switch-btn .nm{font-size:13.5px}
    }
  </style>
</head>
<body>

  <div id="topchrome">
    <div class="visa-alert" role="alert">
      <span class="va-ic" aria-hidden="true">⚠️</span>
      <span>アメリカ学生ビザ <b>新ルール 9月15日</b> より施行開始。転校をお考えの方は <b>今すぐ手続きが必要です！</b></span>
    </div>

    <nav class="switch-bar" role="tablist" aria-label="学校切り替え">
      <button class="switch-btn hei active" id="btnHei" role="tab" aria-selected="true" onclick="showTab('hei')">
        <img class="logo" src="images/logo-orange.png" alt="" aria-hidden="true">
        <span class="tx"><span class="nm">語学学校 HEI</span><span class="sb">Hollywood Education Institute</span></span>
      </button>
      <button class="switch-btn scsu" id="btnScsu" role="tab" aria-selected="false" onclick="showTab('scsu')">
        <img class="logo" src="images/scsu-logo.png" alt="" aria-hidden="true">
        <span class="tx"><span class="nm">大学・大学院 SCSU</span><span class="sb">Southern California State University</span></span>
      </button>
    </nav>
  </div>

  <div class="frame-wrap">
    <iframe id="frameHei"  class="active" src="hei.html" title="HEI 語学学校" loading="eager"></iframe>
    <iframe id="frameScsu" data-src="scsu.html" title="SCSU 大学・大学院" loading="lazy"></iframe>
  </div>

  <script>
    // keep the frames flush beneath the (variable-height) top chrome
    function syncTop(){
      var h = document.getElementById('topchrome').offsetHeight;
      document.querySelector('.frame-wrap').style.top = h + 'px';
    }
    window.addEventListener('resize', syncTop);
    window.addEventListener('load', syncTop);
    syncTop();

    function showTab(tab){
      var isHei = tab === 'hei';
      var fScsu = document.getElementById('frameScsu');
      // lazy-load SCSU on first open
      if(!isHei && !fScsu.src){ fScsu.src = fScsu.getAttribute('data-src'); }

      document.getElementById('btnHei').classList.toggle('active', isHei);
      document.getElementById('btnScsu').classList.toggle('active', !isHei);
      document.getElementById('btnHei').setAttribute('aria-selected', isHei);
      document.getElementById('btnScsu').setAttribute('aria-selected', !isHei);
      document.getElementById('frameHei').classList.toggle('active', isHei);
      fScsu.classList.toggle('active', !isHei);
      document.title = isHei
        ? 'ロサンゼルス語学留学 ｜ HEI 語学学校（日本人向け）'
        : 'ロサンゼルス大学進学・学位取得 ｜ SCSU 認定大学（日本人向け）';
      // reflect selection in the URL hash (shareable deep-link)
      if(history.replaceState) history.replaceState(null, '', isHei ? '#hei' : '#scsu');
      if(typeof gtag==='function') gtag('event','school_tab_switch',{school: isHei ? 'HEI' : 'SCSU'});
    }
    // open SCSU directly via #scsu (e.g. from an ad link)
    if(location.hash === '#scsu'){ showTab('scsu'); }
  </script>

</body>
</html>
