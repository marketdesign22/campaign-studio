<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Southern California State University">
  <defs>
    <path id="scsuArcTop" d="M26 100 A74 74 0 0 0 174 100" fill="none"/>
    <path id="scsuArcBot" d="M30 100 A70 70 0 0 1 170 100" fill="none"/>
    <clipPath id="scsuShield">
      <path d="M72 79 Q72 75 76 75 H124 Q128 75 128 79 V115 Q128 128 100 140 Q72 128 72 115 Z"/>
    </clipPath>
  </defs>

  <g fill="#12608f">
    <!-- rings -->
    <circle cx="100" cy="100" r="97" fill="#fff"/>
    <circle cx="100" cy="100" r="95" fill="none" stroke="#12608f" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="89" fill="none" stroke="#12608f" stroke-width="4"/>

    <!-- circular text -->
    <text font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="14.5" letter-spacing="1.2" fill="#12608f">
      <textPath href="#scsuArcTop" startOffset="50%" text-anchor="middle">SOUTHERN CALIFORNIA STATE</textPath>
    </text>
    <text font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#12608f">
      <textPath href="#scsuArcBot" startOffset="50%" text-anchor="middle">UNIVERSITY</textPath>
    </text>

    <!-- shield base -->
    <path d="M72 79 Q72 75 76 75 H124 Q128 75 128 79 V115 Q128 128 100 140 Q72 128 72 115 Z" fill="#fff" stroke="#12608f" stroke-width="3"/>
    <!-- blue quadrants (top-left, bottom-right) -->
    <g clip-path="url(#scsuShield)">
      <rect x="70" y="73" width="30" height="34" fill="#12608f"/>
      <rect x="100" y="107" width="30" height="35" fill="#12608f"/>
      <line x1="100" y1="75" x2="100" y2="140" stroke="#12608f" stroke-width="2.4"/>
      <line x1="72" y1="107" x2="128" y2="107" stroke="#12608f" stroke-width="2.4"/>
    </g>
    <!-- letters -->
    <g font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="19" text-anchor="middle">
      <text x="86" y="98" fill="#fff">S</text>
      <text x="114" y="98" fill="#12608f">C</text>
      <text x="86" y="129" fill="#12608f">S</text>
      <text x="114" y="129" fill="#fff">U</text>
    </g>

    <!-- laurel sprigs -->
    <g fill="#12608f">
      <g transform="translate(78,132)">
        <path d="M0 0 Q-14 -2 -24 8" fill="none" stroke="#12608f" stroke-width="1.6"/>
        <ellipse cx="-6" cy="1" rx="4" ry="2" transform="rotate(28 -6 1)"/>
        <ellipse cx="-13" cy="3" rx="4" ry="2" transform="rotate(20 -13 3)"/>
        <ellipse cx="-20" cy="7" rx="4" ry="2" transform="rotate(10 -20 7)"/>
        <ellipse cx="-9" cy="6" rx="3.4" ry="1.8" transform="rotate(-40 -9 6)"/>
        <ellipse cx="-16" cy="9" rx="3.4" ry="1.8" transform="rotate(-48 -16 9)"/>
      </g>
      <g transform="translate(122,132) scale(-1,1)">
        <path d="M0 0 Q-14 -2 -24 8" fill="none" stroke="#12608f" stroke-width="1.6"/>
        <ellipse cx="-6" cy="1" rx="4" ry="2" transform="rotate(28 -6 1)"/>
        <ellipse cx="-13" cy="3" rx="4" ry="2" transform="rotate(20 -13 3)"/>
        <ellipse cx="-20" cy="7" rx="4" ry="2" transform="rotate(10 -20 7)"/>
        <ellipse cx="-9" cy="6" rx="3.4" ry="1.8" transform="rotate(-40 -9 6)"/>
        <ellipse cx="-16" cy="9" rx="3.4" ry="1.8" transform="rotate(-48 -16 9)"/>
      </g>
    </g>
  </g>
</svg>
