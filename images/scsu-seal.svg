<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Southern California State University">
  <defs>
    <path id="scsuTop" fill="none" d="M 26 100 A 74 74 0 0 1 174 100"/>
    <path id="scsuBot" fill="none" d="M 22 100 A 78 78 0 0 0 178 100"/>
    <clipPath id="scsuShield">
      <path d="M72 79 Q72 75 76 75 H124 Q128 75 128 79 V115 Q128 128 100 140 Q72 128 72 115 Z"/>
    </clipPath>
  </defs>

  <g fill="#12608f">
    <!-- rings -->
    <circle cx="100" cy="100" r="97" fill="#fff"/>
    <circle cx="100" cy="100" r="95" fill="none" stroke="#12608f" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="#12608f" stroke-width="4"/>

    <!-- circular text -->
    <text font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="13" letter-spacing="0.6" fill="#12608f">
      <textPath href="#scsuTop" startOffset="50%" text-anchor="middle">SOUTHERN CALIFORNIA STATE</textPath>
    </text>
    <text font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="15.5" letter-spacing="3.5" fill="#12608f">
      <textPath href="#scsuBot" startOffset="50%" text-anchor="middle">UNIVERSITY</textPath>
    </text>

    <!-- shield base -->
    <path d="M72 79 Q72 75 76 75 H124 Q128 75 128 79 V115 Q128 128 100 140 Q72 128 72 115 Z" fill="#fff" stroke="#12608f" stroke-width="3"/>
    <!-- blue quadrants (top-left, bottom-right) -->
    <g clip-path="url(#scsuShield)">
      <rect x="70" y="73" width="30" height="34" fill="#12608f"/>
      <rect x="100" y="107" width="30" height="35" fill="#12608f"/>
      <line x1="100" y1="75" x2="100" y2="140" stroke="#12608f" stroke-width="2.4"/>
      <line x1="72" y1="107" x2="128" y2="107" stroke="#12608f" stroke-width="2.4"/>
    </g>
    <!-- letters -->
    <g font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="19" text-anchor="middle">
      <text x="86" y="98" fill="#fff">S</text>
      <text x="114" y="98" fill="#12608f">C</text>
      <text x="86" y="129" fill="#12608f">S</text>
      <text x="114" y="129" fill="#fff">U</text>
    </g>

    <!-- laurel sprigs at the bottom, flanking the shield -->
    <g fill="#12608f" stroke="none">
      <g transform="translate(84,143)">
        <path d="M0 0 Q-13 3 -22 14" fill="none" stroke="#12608f" stroke-width="1.4"/>
        <ellipse cx="-4" cy="2" rx="3.6" ry="1.8" transform="rotate(35 -4 2)"/>
        <ellipse cx="-10" cy="5" rx="3.6" ry="1.8" transform="rotate(28 -10 5)"/>
        <ellipse cx="-16" cy="9" rx="3.6" ry="1.8" transform="rotate(20 -16 9)"/>
        <ellipse cx="-8" cy="8" rx="3" ry="1.5" transform="rotate(-30 -8 8)"/>
        <ellipse cx="-14" cy="12" rx="3" ry="1.5" transform="rotate(-38 -14 12)"/>
      </g>
      <g transform="translate(116,143) scale(-1,1)">
        <path d="M0 0 Q-13 3 -22 14" fill="none" stroke="#12608f" stroke-width="1.4"/>
        <ellipse cx="-4" cy="2" rx="3.6" ry="1.8" transform="rotate(35 -4 2)"/>
        <ellipse cx="-10" cy="5" rx="3.6" ry="1.8" transform="rotate(28 -10 5)"/>
        <ellipse cx="-16" cy="9" rx="3.6" ry="1.8" transform="rotate(20 -16 9)"/>
        <ellipse cx="-8" cy="8" rx="3" ry="1.5" transform="rotate(-30 -8 8)"/>
        <ellipse cx="-14" cy="12" rx="3" ry="1.5" transform="rotate(-38 -14 12)"/>
      </g>
    </g>
  </g>
</svg>
