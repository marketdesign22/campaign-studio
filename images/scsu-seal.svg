<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Southern California State University">
  <defs>
    <path id="scsuTop" fill="none" d="M 26 100 A 74 74 0 0 1 174 100"/>
    <path id="scsuBot" fill="none" d="M 22 100 A 78 78 0 0 0 178 100"/>
  </defs>

  <!-- background -->
  <circle cx="100" cy="100" r="96" fill="#fff"/>

  <g fill="none" stroke="#12608f" stroke-width="1.6">
    <!-- double outer rim -->
    <circle cx="100" cy="100" r="95"/>
    <circle cx="100" cy="100" r="90" stroke-width="1"/>
  </g>

  <!-- circular text -->
  <g fill="#12608f" font-family="Georgia,'Times New Roman',serif" font-weight="700">
    <text font-size="13" letter-spacing="0.6">
      <textPath href="#scsuTop" startOffset="50%" text-anchor="middle">SOUTHERN CALIFORNIA STATE</textPath>
    </text>
    <text font-size="15.5" letter-spacing="3.5">
      <textPath href="#scsuBot" startOffset="50%" text-anchor="middle">UNIVERSITY</textPath>
    </text>
  </g>

  <!-- shield: line-art, cross-divided quadrants -->
  <g fill="none" stroke="#12608f" stroke-width="2.4" stroke-linejoin="round">
    <path d="M64 82 Q64 78 68 78 H132 Q136 78 136 82 V108 Q136 135 100 150 Q64 135 64 108 Z"/>
    <line x1="100" y1="78" x2="100" y2="150" stroke-width="2"/>
    <line x1="65" y1="110" x2="135" y2="110" stroke-width="2"/>
  </g>

  <!-- shield letters -->
  <g fill="#12608f" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="21" text-anchor="middle">
    <text x="82" y="103">S</text>
    <text x="118" y="103">C</text>
    <text x="82" y="134">S</text>
    <text x="118" y="134">U</text>
  </g>

  <!-- laurel sprigs flanking the shield point -->
  <g fill="#12608f" stroke="none">
    <g transform="translate(78,144)">
      <path d="M0 0 Q-7 4 -14 9" fill="none" stroke="#12608f" stroke-width="1.3"/>
      <ellipse cx="-3" cy="1"  rx="3.3" ry="1.6" transform="rotate(28 -3 1)"/>
      <ellipse cx="-8" cy="3"  rx="3.3" ry="1.6" transform="rotate(22 -8 3)"/>
      <ellipse cx="-13" cy="6" rx="3.3" ry="1.6" transform="rotate(16 -13 6)"/>
      <ellipse cx="-6" cy="5"  rx="2.9" ry="1.4" transform="rotate(-34 -6 5)"/>
      <ellipse cx="-11" cy="9" rx="2.9" ry="1.4" transform="rotate(-40 -11 9)"/>
    </g>
    <g transform="translate(122,144) scale(-1,1)">
      <path d="M0 0 Q-7 4 -14 9" fill="none" stroke="#12608f" stroke-width="1.3"/>
      <ellipse cx="-3" cy="1"  rx="3.3" ry="1.6" transform="rotate(28 -3 1)"/>
      <ellipse cx="-8" cy="3"  rx="3.3" ry="1.6" transform="rotate(22 -8 3)"/>
      <ellipse cx="-13" cy="6" rx="3.3" ry="1.6" transform="rotate(16 -13 6)"/>
      <ellipse cx="-6" cy="5"  rx="2.9" ry="1.4" transform="rotate(-34 -6 5)"/>
      <ellipse cx="-11" cy="9" rx="2.9" ry="1.4" transform="rotate(-40 -11 9)"/>
    </g>
  </g>
</svg>
