<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<style>
  :root{--orange:#F99521;--orange-deep:#EC6A0E;--ink:#5a3d23;--cream:#FFF6EA;--yellow:#FFE24A;--line:#06C755;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#fff}
  .banner{width:160px;height:600px;position:relative;overflow:hidden;background:var(--orange);
    font-family:"IPAGothic","Noto Sans JP",sans-serif;color:#fff;font-weight:800;text-align:center}
  .spark{position:absolute;color:#fff;opacity:.85;pointer-events:none}
  .spark.s1{top:96px;left:8px;font-size:14px;color:var(--yellow)}
  .spark.s2{top:120px;right:9px;font-size:11px}
  .spark.s3{top:150px;left:12px;font-size:9px}
  .spark.s4{top:88px;right:16px;font-size:9px;color:var(--yellow)}
  /* top */
  .top{padding:14px 8px 4px;position:relative;z-index:2}
  .mark{width:36px;height:auto;margin:0 auto 4px;display:block;fill:#fff}
  .brand{font-size:7px;letter-spacing:.05em;line-height:1.3;opacity:.95}
  .accet{display:inline-block;border:2px solid #fff;border-radius:999px;font-size:9px;font-weight:900;padding:2px 12px;margin-top:8px}
  .hmsg{position:relative;height:56px;margin-top:8px}
  .hmsg>div{position:absolute;left:0;right:0;top:0;font-size:17px;font-weight:900;line-height:1.2;letter-spacing:-.02em;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.18)}
  .hmsg .mB{opacity:0}
  .mA{animation:swA 2400ms steps(1,end) infinite}
  .mB{animation:swB 2400ms steps(1,end) infinite}
  @keyframes swA{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
  @keyframes swB{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
  /* card */
  .card{margin:6px 9px 0;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);
    padding:14px 8px 16px;color:var(--ink);position:relative;z-index:2}
  .ct{font-size:11.5px;font-weight:900;line-height:1.45}
  .ct b{color:var(--orange-deep)}
  .price{font-size:58px;font-weight:900;color:var(--orange);line-height:.9;letter-spacing:-.03em;margin-top:4px;
    text-shadow:3px 3px 0 var(--cream);animation:pulse 2400ms ease-in-out infinite;transform-origin:center}
  .price .c{font-size:.48em;vertical-align:.4em}
  @keyframes pulse{0%,50%,100%{transform:scale(1)}25%,75%{transform:scale(1.06)}}
  .yen{font-size:11px;font-weight:900;color:var(--ink);margin-top:2px}
  .note{font-size:8px;color:#9a8558;font-weight:700;margin-top:6px;line-height:1.35}
  /* cta */
  .cta{margin:12px 12px 0;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:999px;
    box-shadow:3px 3px 0 var(--ink);font-size:14px;font-weight:900;padding:11px 6px;position:relative;z-index:2;
    animation:pulse 2400ms ease-in-out infinite;transform-origin:center}
  /* photo strip */
  .photos{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;z-index:1}
  .photos img{width:33.34%;height:100%;object-fit:cover}
  .fade{position:absolute;left:0;right:0;bottom:96px;height:26px;background:linear-gradient(transparent,var(--orange));z-index:1}
</style></head>
<body>
<div class="banner">
  <div class="spark s1">✦</div><div class="spark s2">✦</div><div class="spark s3">✦</div><div class="spark s4">✦</div>

  <div class="top">
    <svg class="mark" viewBox="0 0 120 92"><polygon points="60,4 116,32 60,60 4,32"/><rect x="103" y="33" width="8" height="40" rx="1.5"/><rect x="100" y="67" width="15" height="8" rx="1.5"/><polygon points="20,43 60,62 60,81 20,60"/><polygon points="100,43 60,62 60,81 100,60"/></svg>
    <div class="brand">HOLLYWOOD<br>EDUCATION INSTITUTE</div>
    <div class="accet">ACCET認定校</div>
    <div class="hmsg">
      <div class="mA">アメリカ最安値の<br>自信あり！</div>
      <div class="mB">初めての留学<br>・転校の方に！</div>
    </div>
  </div>

  <div class="card">
    <div class="ct">HEI 20周年記念<br>スタンダードESL<br><b>3ヶ月の授業料が！</b></div>
    <div class="price"><span class="c">$</span>900</div>
    <div class="yen">（約 ¥144,000）</div>
    <div class="note">※2026年12月31日までの<br>お申し込み対象</div>
  </div>

  <div class="cta">▶ ここをクリック</div>

  <div class="fade"></div>
  <div class="photos">
    <img src="../landing-page/images/02.jpg" alt="">
    <img src="../landing-page/images/04.jpg" alt="">
    <img src="../landing-page/images/08.jpg" alt="">
  </div>
</div>
</body></html>
