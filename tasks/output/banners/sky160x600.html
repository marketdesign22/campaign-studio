<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<style>
  :root{--orange:#F99521;--orange-deep:#EC6A0E;--ink:#5a3d23;--cream:#FFF6EA;--yellow:#FFC83D;--pink:#FF4FA0;--line:#06C755;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#fff}
  .banner{width:160px;height:600px;position:relative;overflow:hidden;background:var(--orange);
    font-family:"IPAGothic","Noto Sans JP",sans-serif;color:#fff;font-weight:800;text-align:center}
  /* top */
  .top{padding:14px 10px 8px;position:relative}
  .mark{width:34px;height:auto;margin:0 auto 4px;display:block;fill:#fff}
  .brand{font-size:8.5px;letter-spacing:.06em;line-height:1.25;opacity:.95}
  .anniv{margin-top:8px;font-size:12px;color:#fff}
  .camp{margin-top:2px;font-size:15px;font-weight:900;color:var(--yellow);line-height:1.15;text-shadow:0 1px 0 rgba(0,0,0,.15)}
  .shine{position:absolute;top:0;bottom:0;left:-45%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);animation:shine 2400ms linear infinite}
  @keyframes shine{0%{left:-45%}42%{left:130%}100%{left:130%}}
  /* mid card */
  .card{margin:10px 9px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);
    padding:14px 8px 16px;color:var(--ink);position:relative}
  .lead{font-size:12px;font-weight:900;line-height:1.3}
  .lead b{color:var(--orange-deep)}
  .sub{font-size:9.5px;color:#8a7558;font-weight:700;margin-top:5px}
  .pricetag{display:inline-block;background:var(--orange-deep);color:#fff;font-size:8.5px;font-weight:800;padding:3px 9px;border-radius:999px;margin:9px 0 2px}
  .price{font-size:52px;font-weight:900;color:var(--orange);line-height:.9;letter-spacing:-.02em;text-shadow:2px 2px 0 var(--cream);animation:pulse 2400ms ease-in-out infinite;transform-origin:center}
  .price .c{font-size:.5em;vertical-align:.35em}
  @keyframes pulse{0%,50%,100%{transform:scale(1)}25%,75%{transform:scale(1.07)}}
  .plan{font-size:11px;font-weight:900;margin-top:4px}
  .yen{font-size:8.5px;color:#a8916f;font-weight:700;margin-top:2px}
  .wow{position:absolute;top:-14px;right:-8px;width:52px;height:52px;border-radius:50%;background:var(--yellow);
    border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;flex-direction:column;align-items:center;
    justify-content:center;font-size:8px;font-weight:900;color:var(--ink);line-height:1.15;transform:rotate(-12deg);
    animation:wig 2400ms ease-in-out infinite;transform-origin:center}
  .wow b{color:var(--orange-deep);font-size:10px}
  @keyframes wig{0%,100%{transform:rotate(-12deg) scale(1)}25%{transform:rotate(-4deg) scale(1.08)}60%{transform:rotate(-18deg) scale(1)}}
  /* bottom */
  .bot{position:absolute;left:0;right:0;bottom:0;padding:0 10px 16px}
  .cta{background:var(--line);color:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);
    font-size:12px;font-weight:900;padding:10px 6px;display:flex;align-items:center;justify-content:center;gap:5px;
    animation:pulse 2400ms ease-in-out infinite;transform-origin:center}
  .cta svg{width:15px;height:15px;fill:#fff}
  .dl{margin-top:8px;font-size:9px;color:#fff;font-weight:800}
  .dl b{color:var(--yellow)}
</style></head>
<body>
<div class="banner">
  <div class="top">
    <div class="shine"></div>
    <svg class="mark" viewBox="0 0 120 92"><polygon points="60,4 116,32 60,60 4,32"/><rect x="103" y="33" width="8" height="40" rx="1.5"/><rect x="100" y="67" width="15" height="8" rx="1.5"/><polygon points="20,43 60,62 60,81 20,60"/><polygon points="100,43 60,62 60,81 100,60"/></svg>
    <div class="brand">HOLLYWOOD<br>EDUCATION INSTITUTE</div>
    <div class="anniv">創立20周年記念</div>
    <div class="camp">特別期間限定<br>キャンペーン</div>
  </div>

  <div class="card">
    <div class="wow">約3ヶ月分が<br><b>なんと!!</b></div>
    <div class="lead">アメリカ語学留学<br><b>最安値クラス</b></div>
    <div class="pricetag">スタンダードESL 11週間</div>
    <div class="price"><span class="c">$</span>900</div>
    <div class="yen">約 ¥144,000</div>
    <div class="sub">日本人スタッフ・LINEで相談OK<br>ビザ／転校もまるごとサポート</div>
  </div>

  <div class="bot">
    <div class="cta">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 5.69 2 10.23c0 4.07 3.58 7.48 8.42 8.12.33.07.78.22.89.5.1.26.07.66.03.92l-.14.86c-.04.26-.2 1.02.89.56 1.1-.46 5.9-3.48 8.05-5.95C21.4 13.6 22 11.99 22 10.23 22 5.69 17.52 2 12 2Z"/></svg>
      LINEで無料相談
    </div>
    <div class="dl"><b>2026年12月31日まで</b></div>
  </div>
</div>
</body></html>
