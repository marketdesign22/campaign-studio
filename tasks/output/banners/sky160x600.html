<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<style>
  :root{--orange:#F99521;--orange-deep:#EC6A0E;--ink:#5a3d23;--cream:#FFF6EA;--yellow:#FFC83D;--line:#06C755;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#fff}
  .banner{width:160px;height:600px;position:relative;overflow:hidden;background:var(--orange);
    font-family:"IPAGothic","Noto Sans JP",sans-serif;color:#fff;font-weight:800;text-align:center}
  /* top */
  .top{padding:18px 10px 8px;position:relative}
  .mark{width:40px;height:auto;margin:0 auto 5px;display:block;fill:#fff}
  .brand{font-size:7.5px;letter-spacing:.06em;line-height:1.3;opacity:.95}
  .anniv{margin-top:14px;font-size:21px;font-weight:900;color:var(--yellow);line-height:1.1;text-shadow:0 1px 0 rgba(0,0,0,.18)}
  .shine{position:absolute;top:0;bottom:0;left:-45%;width:42%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);animation:shine 2400ms linear infinite}
  @keyframes shine{0%{left:-45%}42%{left:130%}100%{left:130%}}
  /* mid card */
  .card{margin:16px 9px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);
    padding:24px 8px 26px;color:var(--ink)}
  .tag{font-size:12px;font-weight:900;color:var(--orange-deep);line-height:1.25}
  .price{font-size:70px;font-weight:900;color:var(--orange);line-height:.9;letter-spacing:-.03em;margin-top:6px;
    text-shadow:3px 3px 0 var(--cream);animation:pulse 2400ms ease-in-out infinite;transform-origin:center}
  .price .c{font-size:.46em;vertical-align:.4em}
  @keyframes pulse{0%,50%,100%{transform:scale(1)}25%,75%{transform:scale(1.07)}}
  .plan{font-size:12.5px;font-weight:900;margin-top:12px;color:var(--ink)}
  /* bottom */
  .bot{position:absolute;left:0;right:0;bottom:0;padding:0 10px 18px}
  .cta{background:var(--line);color:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);
    font-size:14px;font-weight:900;padding:13px 6px;display:flex;align-items:center;justify-content:center;gap:6px;
    animation:pulse 2400ms ease-in-out infinite;transform-origin:center}
  .cta svg{width:15px;height:15px;fill:#fff}
  .dl{margin-top:10px;font-size:10px;color:#fff;font-weight:800}
</style></head>
<body>
<div class="banner">
  <div class="top">
    <div class="shine"></div>
    <svg class="mark" viewBox="0 0 120 92"><polygon points="60,4 116,32 60,60 4,32"/><rect x="103" y="33" width="8" height="40" rx="1.5"/><rect x="100" y="67" width="15" height="8" rx="1.5"/><polygon points="20,43 60,62 60,81 20,60"/><polygon points="100,43 60,62 60,81 100,60"/></svg>
    <div class="brand">HOLLYWOOD<br>EDUCATION INSTITUTE</div>
    <div class="anniv">20周年<br>記念</div>
  </div>

  <div class="card">
    <div class="tag">アメリカ語学留学</div>
    <div class="price"><span class="c">$</span>900</div>
    <div class="plan">スタンダードESL<br>約3ヶ月</div>
  </div>

  <div class="bot">
    <div class="cta">
      <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.4L10 20 5 3z"/></svg>
      ここをクリック
    </div>
    <div class="dl">2026年12月31日まで</div>
  </div>
</div>
</body></html>
